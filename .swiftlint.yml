# SwiftLint config: https://realm.github.io/SwiftLint/rule-directory.html
# Formatting is SwiftFormat's job (.swiftformat); rules that would fight it
# are disabled here. The Atlas target's "Lint" build phase runs both
# tools on every local build. Goal: zero warnings.

included:
  - Atlas
  - AtlasTests
  - AtlasUITests
  - MCPBridge

excluded:
  - .claude
  - build
  - DerivedData

disabled_rules:
  - trailing_comma   # SwiftFormat's trailingCommas rule owns this
  - opening_brace    # conflicts with SwiftFormat's wrapMultilineStatementBraces
  - todo             # TODOs are tracked notes, not defects

# SwiftUI-friendly thresholds; anything past them gets split up.
line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 80
  error: 120

# A switch that maps each case to one value isn't complex: count the
# branches around it, not its cases.
cyclomatic_complexity:
  ignores_case_statements: true

function_parameter_count:
  warning: 6
  error: 8

large_tuple:
  warning: 3
  error: 4

identifier_name:
  excluded:
    - id
    - vm   # view model
    - ai   # Palette.ai: the AI colour (README — Design system §1)
    - ok   # Palette.ok: the state colour for live, connected, passed
    - ui   # AutopilotArtworkShow: the app, no device
    - x
    - y
    - i
    - x1   # x1…y2: a curve's control points (UnitBezier)
    - y1
    - x2
    - y2
    - rx   # rx, ry: an ellipse's radii (GlobeBand)
    - ry

# README — Design system: no loose colours, text sizes or radii in the UI.
# Mockups of Apple's pages, screenshot templates and artwork keep their own.
custom_rules:
  design_system_color:
    name: "Design system colour"
    regex: 'Color\((red|white|hue): '
    included: '^.*/Atlas/(Screens|DesignSystem)/.*\.swift$'
    excluded: '/(Screenshots/(Rendering|Model|Artwork|TemplateEditor|Studio)|Suggestions/StorePreview|Pricing/Retention/Preview|Welcome/Header|AtlasMark|InAppEvents/Components|Screenshots/Components/AppPreviewTile|AppIcon)/?'
    message: "Use a Palette token (Assets.xcassets/Palette), not a loose colour."
    severity: warning
  design_system_font_size:
    name: "Design system text size"
    regex: '\.system\(size: [0-9]'
    included: '^.*/Atlas/(Screens|DesignSystem)/.*\.swift$'
    excluded: '/(Screenshots/(Rendering|Model|Artwork|TemplateEditor)|Suggestions/StorePreview|Pricing/Retention/Preview|Welcome/Header|AtlasMark|InAppEventStorePreview|StoreProductPreviewCard|StudioSearchCard|HeaderStyle|ArtworkSketch|InAppEventArtworkTextLayer|AppPreviewPosterView|Font\+TextStyles)'
    message: "Use one of the ten text styles (.body, .callout, .subheadline…), not a point size."
    severity: warning
  design_system_radius:
    name: "Design system radius"
    regex: 'cornerRadius: [1-9][0-9]*(\.[0-9]+)?\s*[,)]'
    included: '^.*/Atlas/(Screens|DesignSystem)/.*\.swift$'
    excluded: '/(Screenshots/(Rendering|Model|Artwork|TemplateEditor)|Suggestions/StorePreview|Pricing/Retention/Preview|Welcome/Header|AtlasMark|InAppEventStorePreview|StoreProductPreviewCard|StudioSearchCard|HeaderStyle|ArtworkSketch|InAppEventArtworkTextLayer|AppPreviewPosterView|InAppEvents/Components/Artwork|Tokens/Radius)'
    message: "Use a Radius token (4, 6, 8, 10, 12, 16, 20) or a Capsule."
    severity: warning
